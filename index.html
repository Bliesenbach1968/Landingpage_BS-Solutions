<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BS Solutions UG (haftungsbeschränkt)</title>
  <meta name="description" content="BS Solutions – Software für Einsatzplanung und Bestandssanierung: myDispo & Bestandsprofi.">
  <meta property="og:image" content="Public/web/hero.jpg">
  <link rel="icon" type="image/png" href="Public/web/favicon-64.png?v=2026110705">
  <link rel="apple-touch-icon" href="Public/web/apple-touch-icon.png?v=2026110705">
  <link rel="preload" as="image" href="Public/web/hero.jpg?v=2026110705">
  <link rel="stylesheet" href="hero.css?v=2026110811">
</head>
<body>
  <main class="stage" id="stage">

    <!-- Schluss-Szene: Hero-Video (liegt unter dem Film, wird weich eingeblendet; danach startet der Film von vorn) -->
    <video class="hero-image" id="heroVideo" muted playsinline preload="auto" poster="Public/web/hero.jpg?v=2026110705"
           aria-label="BS Solutions – Team arbeitet gemeinsam an einem digitalen Dashboard">
      <source src="Public/BS%20Solutions%20hero_Video_original.mp4?v=2026110705" type="video/mp4">
    </video>

    <!-- Film: fünf Clips, die mit Pixel-Übergang ineinander übergehen (Reihenfolge/Längen in hero.js) -->
    <div class="film" id="film">
      <video class="clip is-active" id="clipA" muted playsinline preload="auto" poster="Public/web/bestand-poster.jpg?v=2026110705">
        <source src="Public/bg-video.mp4?v=2026110705" type="video/mp4">
      </video>
      <video class="clip" id="clipB" muted playsinline preload="auto" poster="Public/web/buero-poster.jpg?v=2026110705">
        <source src="Public/BS%20Buero_Video_original.mp4?v=2026110705" type="video/mp4">
      </video>
      <video class="clip" id="clipC" muted playsinline preload="auto" poster="Public/web/bss-poster.jpg?v=2026110705">
        <source src="Public/BSS%20Video_original.mp4?v=2026110705" type="video/mp4">
      </video>
      <video class="clip" id="clipD" muted playsinline preload="auto" poster="Public/web/future-poster.jpg?v=2026110705">
        <source src="Public/BS%20Future_Video_original.mp4?v=2026110705" type="video/mp4">
      </video>
      <video class="clip" id="clipE" muted playsinline preload="auto" poster="Public/web/mydispo-kurz-poster.jpg?v=2026110801">
        <source src="Public/myDispo_Film_kurz.mp4?v=2026110801" type="video/mp4">
      </video>
      <!-- Produkt-Logos (freigestellt): blenden mittig ein und wieder aus, sobald ihr Clip läuft – Animation per CSS -->
      <div class="clip-title clip-title--bestandsprofi" aria-hidden="true">
        <img src="Public/web/logo-bestandsprofi-hell.png?v=2026110804" alt="">
      </div>
      <div class="clip-title clip-title--mydispo" aria-hidden="true">
        <img src="Public/web/logo-mydispo-hell.png?v=2026110805" alt="">
      </div>
      <!-- Film-Look: Pixel-Glitch, Korn, Kratzer, Flackern, Vignette -->
      <canvas class="pixel-fx" id="pixelFx" aria-hidden="true"></canvas>
      <div class="fx grain" id="grain" aria-hidden="true"></div>
      <div class="fx scratches" aria-hidden="true"></div>
      <div class="fx flicker" aria-hidden="true"></div>
      <div class="fx vignette" aria-hidden="true"></div>
    </div>

    <!-- Hochformat: dunkler Verlauf unten, verdeckt den im Video eingebrannten (dort abgeschnittenen) Schriftzug -->
    <div class="mobile-shade" aria-hidden="true"></div>

    <!-- Claim: im Querformat steckt er im Video, im Hochformat wird er als Text gezeigt -->
    <h1 class="claim">Wir entwickeln <span>Software-Lösungen</span></h1>

    <!-- weicher Lichtschleier beim Übergang -->
    <div class="veil" aria-hidden="true"></div>

    <!-- Logo-Leiste (erscheint nach dem Film; freigestellte Logos) -->
    <nav class="logo-bar" id="logoBar" aria-label="Unsere Produkte">
      <a href="https://mydispo.cloud" class="logo-chip" target="_blank" rel="noopener">
        <img src="Public/web/logo-mydispo-hell.png?v=2026110805" alt="myDispo – Alltagsbegleitung und Einsatzplanung">
      </a>
      <a href="https://bestandsprofi.de" class="logo-chip" target="_blank" rel="noopener">
        <img src="Public/web/logo-bestandsprofi-hell.png?v=2026110805" alt="Bestandsprofi – Sanierungssoftware">
      </a>
    </nav>

    <!-- Steuerung während des Films -->
    <div class="film-controls" id="filmControls">
      <button type="button" class="ctrl" id="skipBtn">Überspringen ⏭</button>
    </div>
    <div class="progress" id="progress"><span id="progressBar"></span></div>

    <!-- Fallback, falls Autoplay blockiert ist -->
    <button type="button" class="start-btn" id="startBtn" hidden>▶ Film starten</button>

    <!-- Nach dem Film -->
    <div class="end-ui" id="endUi">
      <button type="button" class="ctrl" id="replayBtn">↻ Film von vorn</button>
    </div>

    <!-- immer sichtbar: Pflichtlinks; KI-Kennzeichnung (EU AI Act Art. 50) steht in Datenschutz/Impressum, nicht auf dem Video -->
    <footer class="footer-bar">
      <nav class="legal-links">
        <a href="datenschutz.html#ki-hinweis">KI-Hinweis</a>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>
  </main>

  <script src="hero.js?v=2026110811"></script>
</body>
</html>
